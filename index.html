<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Buku Induk Digital - MTs Darul Arham</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-2xl font-bold mb-6 text-slate-800">Buku Induk Siswa MTs Darul Arham</h1>
    <div id="loading" class="text-gray-500">Memuat data siswa...</div>
    <div id="siswa-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </div>

  <script>
    // Ganti dengan URL Web App dari Apps Script kamu
    const API_URL = "https://script.google.com/macros/s/AKfycbzvy9pG6WpT4KewnIy300gAI_R8btus9wb-gV8ZDbsn6iZypxgSU7eZwSG3tdQeHE-4/exec?action=getSiswa";

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        document.getElementById('loading').classList.add('hidden');
        const container = document.getElementById('siswa-list');
        
        data.forEach(siswa => {
          const card = `
            <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
              <div class="flex justify-between items-start mb-3">
                <div>
                  <h2 class="font-bold text-lg text-slate-900">${siswa.Nama}</h2>
                  <p class="text-xs text-slate-500">NIS: ${siswa.NIS} | NISN: ${siswa.NISN}</p>
                </div>
                <span class="px-2 py-1 text-xs font-semibold rounded bg-blue-100 text-blue-800">
                  Kelas ${siswa.Tingkat} (${siswa.Status})
                </span>
              </div>
              <div class="text-sm text-slate-600 space-y-1">
                <p><strong>TTL:</strong> ${siswa['Tempat Lahir']}, ${siswa['Tanggal Lahir']}</p>
                <p><strong>Orang Tua:</strong> ${siswa['Nama Ayah']} / ${siswa['Nama Ibu']}</p>
                <p><strong>Keterangan:</strong> ${siswa.Keterangan || '-'}</p>
              </div>
            </div>
          `;
          container.innerHTML += card;
        });
      })
      .catch(err => {
        document.getElementById('loading').innerText = 'Gagal memuat data.';
      });
  </script>
</body>
</html>
