<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTs Darul Arham - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- HEADER -->
  <header class="bg-green-800 text-white px-6 py-3 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-3">
      <img src="logo.png" alt="Logo" class="w-10 h-10 rounded-full bg-white p-1" onerror="this.src='https://via.placeholder.com/40'">
      <h1 class="text-lg font-bold">MTs Darul Arham</h1>
    </div>
    <div class="flex items-center gap-4">
      <span>🔔</span>
      <span>👤 Admin</span>
    </div>
  </header>

  <div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-green-800 text-white p-4">
      <nav class="space-y-2">
        <a href="#" onclick="loadModule('dashboard.html', this)" class="nav-item block px-3 py-2 rounded bg-yellow-500 text-green-900 font-semibold">🏠 Dashboard</a>
        <a href="#" onclick="loadModule('siswa.html', this)" class="nav-item block px-3 py-2 rounded hover:bg-green-700">👨‍🎓 Siswa</a>
        <a href="#" onclick="loadModule('guru.html', this)" class="nav-item block px-3 py-2 rounded hover:bg-green-700">👨‍🏫 Guru</a>
        <a href="#" onclick="loadModule('mapel.html', this)" class="nav-item block px-3 py-2 rounded hover:bg-green-700">📚 Mapel</a>
        <a href="#" onclick="loadModule('kelas.html', this)" class="nav-item block px-3 py-2 rounded hover:bg-green-700">🏫 Kelas</a>
        <a href="#" onclick="loadModule('semester.html', this)" class="nav-item block px-3 py-2 rounded hover:bg-green-700">📅 Semester</a>

        <!-- DROPDOWN RAPOR -->
        <div>
          <button onclick="this.nextElementSibling.classList.toggle('hidden')" class="w-full text-left px-3 py-2 rounded hover:bg-green-700 flex justify-between items-center">
            <span>📊 Rapor</span>
            <span>▾</span>
          </button>
          <div class="hidden pl-4 text-sm mt-1 space-y-1">
            <a href="#" onclick="loadModule('upload-rapor.html', this)" class="block px-3 py-1 hover:bg-green-700 rounded">Upload Nilai Rapor</a>
            <a href="#" onclick="loadModule('upload-wali.html', this)" class="block px-3 py-1 hover:bg-green-700 rounded">Upload Nilai Wali Kelas</a>
            <a href="#" onclick="loadModule('cetak-rapor.html', this)" class="block px-3 py-1 hover:bg-green-700 rounded">Cetak Rapor</a>
          </div>
        </div>

        <!-- DROPDOWN KEHADIRAN -->
        <div>
          <button onclick="this.nextElementSibling.classList.toggle('hidden')" class="w-full text-left px-3 py-2 rounded hover:bg-green-700 flex justify-between items-center">
            <span>✅ Kehadiran</span>
            <span>▾</span>
          </button>
          <div class="hidden pl-4 text-sm mt-1 space-y-1">
            <a href="#" onclick="loadModule('absensi-siswa.html', this)" class="block px-3 py-1 hover:bg-green-700 rounded">Kehadiran Siswa</a>
            <a href="#" onclick="loadModule('absensi-guru.html', this)" class="block px-3 py-1 hover:bg-green-700 rounded">Kehadiran Guru</a>
          </div>
        </div>
      </nav>
    </aside>

    <!-- WADAH KONTEN DINAMIS -->
    <main id="app-content" class="flex-1 p-6">
      <p class="text-gray-500">Memuat halaman...</p>
    </main>
  </div>

  <!-- SCRIPT IMPORT DINAMIS -->
  <script>
    async function loadModule(file, element) {
      const contentDiv = document.getElementById('app-content');
      contentDiv.innerHTML = '<div class="text-center py-10 text-gray-500">Memuat data...</div>';

      try {
        const response = await fetch(file);
        if (!response.ok) throw new Error('File tidak ditemukan');
        const html = await response.text();
        contentDiv.innerHTML = html;

        // Jalankan script di dalam file modul jika ada
        const scripts = contentDiv.querySelectorAll('script');
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          newScript.textContent = oldScript.textContent;
          document.body.appendChild(newScript).parentNode.removeChild(newScript);
        });

        // Update styling menu aktif
        if (element) {
          document.querySelectorAll('.nav-item').forEach(nav => {
            nav.classList.remove('bg-yellow-500', 'text-green-900', 'font-semibold');
            nav.classList.add('hover:bg-green-700');
          });
          element.classList.add('bg-yellow-500', 'text-green-900', 'font-semibold');
          element.classList.remove('hover:bg-green-700');
        }
      } catch (error) {
        contentDiv.innerHTML = `<div class="p-4 bg-red-100 text-red-700 rounded">Gagal memuat modul: ${error.message}</div>`;
      }
    }

    // Muat dashboard secara otomatis saat pertama kali dibuka
    window.addEventListener('DOMContentLoaded', () => {
      loadModule('dashboard.html', document.querySelector('.nav-item'));
    });
  </script>
</body>
</html>
