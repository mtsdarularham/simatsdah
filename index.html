<script>
    // URL Web App dari Google Apps Script kamu
    const API_URL = "https://script.google.com/macros/s/AKfycbxdSCLypy_s2mICSRL3gWa5CNy0j9U7swGgkdW4cCksig-iPu6tD7-5Rd99FDDBU_c/exec";

    let studentsData = [];
    let deleteTargetIndex = null;

    // Fungsi Fetch Data Dinamis dari Google Sheets + Shorting multi-kriteria
    function fetchAndRenderData() {
      const tbody = document.getElementById('studentTableBody');
      tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4 text-slate-400">Memuat data dari Google Sheets...</td></tr>';

      fetch(API_URL)
        .then(response => response.json())
        .then(data => {
          // Pemetaan data dari Sheets ke Objek JS
          studentsData = data.map(item => ({
            id: String(item['ID'] || ''),
            nik: String(item['NIK'] || '-'),
            nis: String(item['NIS'] || '-'),
            nisn: String(item['NISN'] || '-'),
            nama: item['Nama'] || '',
            tempatLahir: item['Tempat Lahir'] || '-',
            tanggalLahir: item['Tanggal Lahir'] ? new Date(item['Tanggal Lahir']).toISOString().split('T')[0] : '',
            jk: item['Jenis Kelamin'] || '-',
            sekolahAsal: item['Sekolah Asal'] || '-',
            namaAyah: item['Nama Ayah'] || '-',
            namaIbu: item['Nama Ibu'] || '-',
            tahunMasuk: String(item['Tahun Masuk'] || '-'),
            tahunKeluar: String(item['Tahun Keluar'] || '-'),
            status: item['Status'] || 'Aktif',
            tingkat: String(item['Tingkat'] || '-'),
            fotoAwal: item['Foto Awal'] || '',
            fotoLulus: item['Foto Lulus'] || '',
            fotoKK: item['Foto KK'] || '',
            ijazah: item['Ijazah'] || '',
            keterangan: item['Keterangan'] || '-'
          }));

          // PENGURUTAN (SORTING) DATA:
          // 1. Status: "Aktif" di atas, selain "Aktif" (Lulus, Mutasi, Keluar) di bawah
          // 2. ID: Paling kecil ke besar (Ascending)
          // 3. Nama: A - Z (Ascending)
          studentsData.sort((a, b) => {
            // 1. Urutkan Status (Aktif mendahului non-Aktif)
            const isAktifA = a.status.toLowerCase() === 'aktif' ? 0 : 1;
            const isAktifB = b.status.toLowerCase() === 'aktif' ? 0 : 1;
            if (isAktifA !== isAktifB) {
              return isAktifA - isAktifB;
            }

            // 2. Urutkan ID (Kecil ke Besar)
            const idA = parseFloat(a.id) || 0;
            const idB = parseFloat(b.id) || 0;
            if (idA !== idB) {
              return idA - idB;
            }

            // 3. Urutkan Nama (A - Z)
            return a.nama.localeCompare(b.nama);
          });

          renderTable();
        })
        .catch(error => {
          console.error('Error fetching data:', error);
          tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4 text-red-500">Gagal memuat data dari Google Sheets. Pastikan URL Web App benar.</td></tr>';
        });
    }

    // Render Tabel Utama
    function renderTable(data = studentsData) {
      const tbody = document.getElementById('studentTableBody');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4 text-slate-400">Tidak ada data siswa.</td></tr>';
        return;
      }

      data.forEach((item, index) => {
        const badgeBg = item.status.toLowerCase() === 'aktif' ? 'bg-emerald-700 text-white' : 'bg-slate-600 text-white';
        const row = `
          <tr class="hover:bg-slate-50 border-b border-slate-100">
            <td class="p-3 text-center font-bold text-slate-700">${index + 1}</td>
            <td class="p-3 text-slate-600">${item.id}</td>
            <td class="p-3 font-bold text-slate-800">${item.nama}</td>
            <td class="p-3 text-slate-600">${item.nisn}</td>
            <td class="p-3 text-center text-slate-600">${item.jk}</td>
            <td class="p-3 text-center">
              <span class="px-3 py-1 text-xs font-semibold rounded-full ${badgeBg}">${item.status}</span>
            </td>
            <td class="p-3 text-center">
              <div class="flex items-center justify-center gap-1">
                <button onclick="openDetailModal(${index})" class="p-2 bg-cyan-400 hover:bg-cyan-500 text-white rounded-lg transition-all" title="View"><i class="fa-solid fa-eye"></i></button>
                <button onclick="openFormModal('edit', ${index})" class="p-2 bg-amber-400 hover:bg-amber-500 text-white rounded-lg transition-all" title="Ubah"><i class="fa-solid fa-pen-to-square"></i></button>
                <button onclick="openDeleteModal(${index})" class="p-2 bg-rose-500 hover:bg-rose-600 text-white rounded-lg transition-all" title="Hapus"><i class="fa-solid fa-trash"></i></button>
              </div>
            </td>
          </tr>
        `;
        tbody.innerHTML += row;
      });
    }

    // Panggil fungsi fetch saat pertama kali halaman dimuat
    fetchAndRenderData();
  </script>
